<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berlingo planner</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; background: radial-gradient(ellipse at 50% 0%, #1e293b 0%, #0b1020 60%, #05070d 100%); pointer-events: auto; }
  #start .card { width: min(440px, 100%); box-sizing: border-box; padding: 40px 32px 28px; border-radius: 28px; background: rgba(15,23,42,.72); border: 1px solid rgba(148,163,184,.22); box-shadow: 0 24px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); display: flex; flex-direction: column; align-items: center; gap: 18px; }
  #start h1 { font-size: clamp(34px, 9vw, 46px); line-height: 1.05; margin: 0; letter-spacing: -.02em; background: linear-gradient(180deg, #fff, #94a3b8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #start p { margin: 0; color: #cbd5e1; max-width: 360px; line-height: 1.5; font-size: 16px; }
  #start p.small { color: #94a3b8; font-size: 14px; }
  button { font: inherit; border: 0; border-radius: 14px; background: #334155; color: #fff; padding: 12px 16px; font-size: 16px; pointer-events: auto; touch-action: manipulation; cursor: pointer; }
  button.primary { width: 100%; background: linear-gradient(180deg, #3b82f6, #2563eb); font-size: 22px; font-weight: 600; padding: 18px 24px; border-radius: 18px; box-shadow: 0 0 0 1px rgba(147,197,253,.4), 0 0 28px rgba(59,130,246,.55), 0 10px 30px rgba(37,99,235,.35); transition: box-shadow .2s, transform .1s; }
  button.primary:hover { box-shadow: 0 0 0 1px rgba(191,219,254,.7), 0 0 44px rgba(96,165,250,.8), 0 10px 30px rgba(37,99,235,.45); }
  button.primary:active { transform: scale(.98); }
  button.primary.alt { background: linear-gradient(180deg, #14b8a6, #0f766e); box-shadow: 0 0 0 1px rgba(94,234,212,.4), 0 0 28px rgba(20,184,166,.45), 0 10px 30px rgba(15,118,110,.35); }
  button.primary:disabled { opacity: .35; box-shadow: none; cursor: default; }
  button.ghost { background: transparent; color: #94a3b8; border: 1px solid rgba(148,163,184,.3); font-size: 14px; padding: 9px 16px; }
  button.ghost:hover { color: #e2e8f0; border-color: rgba(148,163,184,.6); }
  #msg { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); background: rgba(0,0,0,.75); padding: 10px 14px; border-radius: 10px; display: none; font-size: 15px; pointer-events: none; }
</style>
</head>
<body>
<div id="overlay">
  <div id="start">
    <div class="card">
      <h1>Berlingo planner</h1>
      <p><b>AR</b> puts the van in your room: point at the floor and pull the trigger. <b>VR</b> parks it on a driveway: walk round it with the left stick.</p>
      <button class="primary" id="startBtn">Start AR</button>
      <button class="primary alt" id="vrBtn">Start VR</button>
      <p class="small" id="noxr" style="display:none">AR and VR need a headset. Open this page in the Meta Quest Browser.</p>
      <button class="ghost" id="previewBtn">Desktop preview</button>
    </div>
  </div>
  <div id="msg"></div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

// ---------- CONFIG (metres / kg). Placeholders until you measure ----------
const PAYLOAD_KG = 600;
const FRONT_AXLE_Z = -1.35, REAR_AXLE_Z = 1.35;   // wheelbase 2.7 m, van centre at 0
const CEILING_Y = 1.735;
const MODEL_VERSION = 'v4';                       // bump when the Blender models change, so headsets don't use stale copies                          // inside roof height above ground (from the model)
const CARGO = { x: 0.75, z0: -0.4, z1: 2.2 };     // load area: bulkhead to rear doors

// Layouts: same surfaces as the desktop planner (A-Frame z = glTF z; front is -z)
const LAYOUTS = {
  Bed:    { file: 'berlingo_bed.glb',    kg: 60, centre: [0, 1.2], surf: [
            { x0: -0.75, x1: 0.75, z0: -0.4, z1: 2.2, top: 0.5 },
            { x0: -0.70, x1: 0.70, z0: 0.44, z1: 2.16, top: 1.08 } ] },
  Lounge: { file: 'berlingo_lounge.glb', kg: 70, centre: [0, 0.8], surf: [
            { x0: -0.75, x1: 0.75, z0: -0.4, z1: 2.2, top: 0.5 },
            { x0: -0.75, x1: -0.35, z0: 0.3, z1: 1.9, top: 0.97 },
            { x0: 0.35, x1: 0.75, z0: 0.3, z1: 1.9, top: 0.97 },
            { x0: -0.30, x1: 0.30, z0: 0.70, z1: 1.30, top: 1.035 } ] },
  Packed: { file: 'berlingo_packed.glb', kg: 25, centre: [0, 0.6], surf: [
            { x0: -0.75, x1: 0.75, z0: -0.4, z1: 2.2, top: 0.5 },
            { x0: -0.40, x1: 0.40, z0: 0.45, z1: 1.85, top: 1.16 },
            { x0: -0.65, x1: -0.25, z0: 0.05, z1: 0.75, top: 0.775 } ] }
};

const ITEM_DEFS = [
  { name: 'Water 20L',      cat: 'Kitchen', kg: 20,  size: [0.30, 0.40, 0.20], color: 0x3b82f6, start: 1 },
  { name: 'Water 10L',      cat: 'Kitchen', kg: 10,  size: [0.24, 0.32, 0.16], color: 0x3b82f6 },
  { name: 'Stove',          cat: 'Kitchen', kg: 4,   size: [0.40, 0.12, 0.35], color: 0xf97316, start: 1 },
  { name: 'Gas bottle',     cat: 'Kitchen', kg: 11,  size: [0.30, 0.40, 0.30], color: 0xef4444, start: 1 },
  { name: 'Kettle',         cat: 'Kitchen', kg: 0.8, size: [0.22, 0.24, 0.18], color: 0xd1d5db },
  { name: 'Pan set',        cat: 'Kitchen', kg: 2.5, size: [0.30, 0.16, 0.45], color: 0x374151 },
  { name: 'Cool box',       cat: 'Kitchen', kg: 6,   size: [0.50, 0.35, 0.35], color: 0x06b6d4, start: 1 },
  { name: 'Spare pillow',   cat: 'Sleep',   kg: 0.5, size: [0.45, 0.12, 0.30], color: 0xf8fafc, start: 1 },
  { name: 'Sleeping bag',   cat: 'Sleep',   kg: 1.6, size: [0.45, 0.28, 0.28], color: 0x15803d },
  { name: 'Duvet bag',      cat: 'Sleep',   kg: 2.5, size: [0.60, 0.30, 0.40], color: 0x94a3b8 },
  { name: 'Crate',          cat: 'Storage', kg: 5,   size: [0.40, 0.30, 0.25], color: 0x64748b, start: 1 },
  { name: 'Tools bag',      cat: 'Storage', kg: 8,   size: [0.40, 0.25, 0.25], color: 0x22c55e, start: 1 },
  { name: 'Rucksack',       cat: 'Storage', kg: 7,   size: [0.32, 0.55, 0.22], color: 0xea580c },
  { name: 'Duffel bag',     cat: 'Storage', kg: 6,   size: [0.60, 0.30, 0.30], color: 0x1f2937 },
  { name: 'Shoe box',       cat: 'Storage', kg: 1.5, size: [0.35, 0.13, 0.22], color: 0xb45309 },
  { name: 'Golf bag',       cat: 'Outdoor', kg: 9,   size: [0.30, 0.95, 0.30], color: 0x1e3a8a, start: 1 },
  { name: 'Football',       cat: 'Outdoor', kg: 0.4, size: [0.28, 0.16, 0.16], color: 0x7c2d12, start: 1 },
  { name: 'Camping chair',  cat: 'Outdoor', kg: 3,   size: [0.15, 0.85, 0.15], color: 0x166534 },
  { name: 'Folding table',  cat: 'Outdoor', kg: 4,   size: [0.60, 0.07, 0.40], color: 0xa8a29e },
  { name: 'Bike',           cat: 'Outdoor', kg: 13,  size: [0.55, 1.00, 1.70], color: 0x0ea5e9 },
  { name: 'Paddleboard bag',cat: 'Outdoor', kg: 11,  size: [0.40, 0.80, 0.30], color: 0x0891b2 },
  { name: 'Leisure battery',cat: 'Power',   kg: 25,  size: [0.35, 0.24, 0.18], color: 0x111827 },
  { name: 'Power station',  cat: 'Power',   kg: 6,   size: [0.30, 0.20, 0.20], color: 0x6b7280 }
];

// ---------- Scene ----------
// alpha: true so the Quest's passthrough camera shows behind the van in AR
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.localClippingEnabled = true;      // for the Sims-style wall views
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.prepend(renderer.domElement);
renderer.domElement.style.position = 'fixed';
renderer.domElement.style.inset = '0';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 50);
// Image-based lighting: soft studio reflections on paint, glass and chrome
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.6));
const sun = new THREE.DirectionalLight(0xfff4e5, 2.2);
sun.position.set(3, 6, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4;
sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -4;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 20;
sun.shadow.bias = -0.0005;
sun.shadow.radius = 4;
scene.add(sun);
scene.add(sun.target);

const world = new THREE.Group();     // the placed anchor: position + facing
world.visible = false;
// stage = everything you walk around (van, items, driveway). Moving/turning it is how you move in VR and AR.
const stage = new THREE.Group();
scene.add(stage);
stage.add(world);
const vanRoot = new THREE.Group();   // van + items, scaled together
world.add(vanRoot);
// Shadow catcher: invisible floor that only shows the van's shadow on your real floor
const shadowFloor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.38 }));
shadowFloor.receiveShadow = true;
shadowFloor.position.y = 0.002;
world.add(shadowFloor);
// Warm interior lights under the ceiling LED strip, so the cargo area isn't a dark box
[0.3, 1.4].forEach(z => {
  const l = new THREE.PointLight(0xffd9a8, 0.9, 3.0, 1.8);
  l.position.set(0, 1.62, z);
  vanRoot.add(l);
});
const fill = new THREE.PointLight(0xffffff, 0.5, 4, 2);   // soft fill from the rear doors
fill.position.set(0, 1.3, 2.6);
vanRoot.add(fill);

// ---------- VR / preview surroundings: sky, ground and a driveway pad (hidden in AR) ----------
let xrMode = 'none';                 // 'ar', 'vr' or 'none' (desktop preview)
const env = new THREE.Group();
stage.add(env);
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 4; skyCanvas.height = 512;
{
  const c = skyCanvas.getContext('2d'), g = c.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#5b8cc9'); g.addColorStop(0.46, '#bcd3ea'); g.addColorStop(0.5, '#e8eef2'); g.addColorStop(1, '#6b7a5a');
  c.fillStyle = g; c.fillRect(0, 0, 4, 512);
}
const skyTex = new THREE.CanvasTexture(skyCanvas);
skyTex.mapping = THREE.EquirectangularReflectionMapping;
skyTex.colorSpace = THREE.SRGBColorSpace;
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 64).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x55663f, roughness: 1 }));
ground.receiveShadow = true;
env.add(ground);
const pad = new THREE.Mesh(new THREE.PlaneGeometry(5.5, 8).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x3f4246, roughness: 0.95 }));
pad.position.y = 0.004; pad.receiveShadow = true;
env.add(pad);

function setMode(mode) {
  xrMode = mode;
  if (typeof stage !== 'undefined') { stage.position.set(0, 0, 0); stage.rotation.set(0, 0, 0); }
  const ar = mode === 'ar';
  env.visible = !ar;
  shadowFloor.visible = ar;
  scene.background = ar ? null : skyTex;
  scene.fog = ar ? null : new THREE.Fog(0xe8eef2, 18, 45);
}
setMode('none');

const loader = new GLTFLoader();
const cache = {};
let currentLayout = 'Bed';
let vanModel = null;
let scaleValue = 1;
let placed = false;

// Items
const items = [];
// ---------- Item models: built from simple parts, each centred on its own middle ----------
const mat = (color, rough = 0.6, metal = 0, extra = {}) =>
  new THREE.MeshStandardMaterial(Object.assign({ color, roughness: rough, metalness: metal }, extra));
const rbox = (w, h, d, r, m) => new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, Math.min(r, w / 2, h / 2, d / 2)), m);
const cylm = (rt, rb, h, m, seg = 32) => new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };

const BUILDERS = {
  'Water 20L': () => {            // blue jerrycan with moulded handle and cap
    const g = new THREE.Group(), plastic = mat(0x2563eb, 0.35, 0, { transparent: true, opacity: 0.92 });
    g.add(rbox(0.30, 0.34, 0.20, 0.04, plastic));
    const handle = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.016, 10, 24, Math.PI), plastic);
    g.add(at(handle, -0.05, 0.17, 0));
    g.add(at(cylm(0.025, 0.025, 0.04, mat(0xf8fafc, 0.5)), 0.09, 0.19, 0));
    return g;
  },
  'Stove': () => {                 // camping stove: case, grates, two burners, knobs
    const g = new THREE.Group();
    g.add(rbox(0.40, 0.10, 0.35, 0.015, mat(0x1f2937, 0.4, 0.5)));
    [-0.09, 0.09].forEach(x => {
      g.add(at(cylm(0.055, 0.055, 0.012, mat(0x111827, 0.3, 0.8)), x, 0.055, -0.02));
      const grate = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.005, 6, 32), mat(0x6b7280, 0.3, 0.9));
      grate.rotation.x = Math.PI / 2; g.add(at(grate, x, 0.065, -0.02));
      const knob = at(cylm(0.015, 0.015, 0.02, mat(0xef4444, 0.4)), x, -0.01, 0.18);
      knob.rotation.x = Math.PI / 2; g.add(knob);
    });
    return g;
  },
  'Gas bottle': () => {            // cylinder with domed shoulder, shroud and valve
    const g = new THREE.Group(), red = mat(0xb91c1c, 0.35, 0.3);
    const pts = [[0, -0.2], [0.14, -0.2], [0.15, -0.18], [0.15, 0.08], [0.13, 0.13], [0.07, 0.16], [0.04, 0.165], [0, 0.165]]
      .map(p => new THREE.Vector2(p[0], p[1]));
    g.add(new THREE.Mesh(new THREE.LatheGeometry(pts, 40), red));
    g.add(at(cylm(0.075, 0.075, 0.035, mat(0x9ca3af, 0.3, 0.9), 24), 0, 0.185, 0));
    g.add(at(cylm(0.15, 0.15, 0.02, mat(0x111827, 0.6)), 0, -0.19, 0));
    return g;
  },
  'Tools bag': () => {             // canvas tool bag with webbing and handles
    const g = new THREE.Group(), canvas = mat(0x3f6212, 0.95), web = mat(0x111827, 0.8);
    g.add(rbox(0.40, 0.22, 0.25, 0.05, canvas));
    [-0.12, 0.12].forEach(x => g.add(at(rbox(0.03, 0.225, 0.255, 0.01, web), x, 0, 0)));
    const h = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.012, 8, 24, Math.PI), web);
    g.add(at(h, 0, 0.11, 0));
    return g;
  },
  'Cool box': () => {              // white body, blue lid, side handles
    const g = new THREE.Group();
    g.add(at(rbox(0.50, 0.28, 0.35, 0.03, mat(0xf1f5f9, 0.4)), 0, -0.03, 0));
    g.add(at(rbox(0.52, 0.07, 0.37, 0.03, mat(0x0284c7, 0.35)), 0, 0.14, 0));
    [-0.26, 0.26].forEach(x => g.add(at(rbox(0.03, 0.04, 0.14, 0.01, mat(0x475569, 0.5)), x, 0.06, 0)));
    return g;
  },
  'Crate': () => {                 // folding storage crate with ribs
    const g = new THREE.Group(), pl = mat(0x475569, 0.55);
    g.add(rbox(0.40, 0.28, 0.25, 0.02, pl));
    g.add(at(rbox(0.42, 0.03, 0.27, 0.01, mat(0x334155, 0.5)), 0, 0.14, 0));
    for (let i = -2; i <= 2; i++) g.add(at(rbox(0.012, 0.24, 0.255, 0.004, mat(0x334155, 0.5)), i * 0.075, -0.01, 0));
    return g;
  },
  'Spare pillow': () => {          // soft rounded pillow
    const p = rbox(0.45, 0.12, 0.30, 0.055, mat(0xf8fafc, 0.95));
    p.scale.set(1, 1, 1);
    return p;
  },
  'Football': () => {              // american football with laces and stripes
    const g = new THREE.Group();
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.08, 32, 20), mat(0x7c2d12, 0.55));
    ball.scale.set(1.75, 1, 1); g.add(ball);
    [-0.09, 0.09].forEach(x => {
      const s = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.006, 8, 32), mat(0xf8fafc, 0.6));
      s.rotation.y = Math.PI / 2; g.add(at(s, x, 0, 0));
    });
    g.add(at(rbox(0.07, 0.006, 0.006, 0.002, mat(0xf8fafc, 0.6)), 0, 0.081, 0));
    for (let i = -3; i <= 3; i++) g.add(at(rbox(0.004, 0.006, 0.02, 0.001, mat(0xf8fafc, 0.6)), i * 0.01, 0.081, 0));
    return g;
  },
  'Golf bag': () => {              // stand bag with collar, strap, legs and a full set of clubs
    const g = new THREE.Group(), navy = mat(0x1e3a8a, 0.7), black = mat(0x0f172a, 0.6), chrome = mat(0xd1d5db, 0.2, 1);
    g.add(at(cylm(0.11, 0.10, 0.78, navy, 40), 0, -0.07, 0));
    g.add(at(cylm(0.125, 0.125, 0.07, black, 40), 0, 0.32, 0));
    g.add(at(cylm(0.105, 0.105, 0.06, black, 40), 0, -0.445, 0));
    g.add(at(rbox(0.06, 0.40, 0.03, 0.01, mat(0x0f172a, 0.6)), 0, 0.0, 0.11));                // pocket
    const strap = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.015, 8, 30, Math.PI * 0.8), black);
    strap.rotation.z = Math.PI / 2; g.add(at(strap, -0.12, 0.0, 0));
    [-0.06, 0.06].forEach(z => {                                                                 // stand legs
      const leg = cylm(0.007, 0.007, 0.75, chrome, 8);
      leg.rotation.x = z * 1.5; g.add(at(leg, -0.13, -0.08, z));
    });
    // clubs: woods with headcovers, irons with blades, putter
    const shaft = (x, z, len) => g.add(at(cylm(0.005, 0.005, len, chrome, 8), x, 0.32 + len / 2 - 0.1, z));
    [[-0.05, -0.04], [0.0, -0.06], [0.05, -0.04]].forEach(([x, z], i) => {
      shaft(x, z, 0.32);
      const cover = new THREE.Mesh(new THREE.SphereGeometry(0.045, 20, 14), mat([0xdc2626, 0xf8fafc, 0x111827][i], 0.8));
      cover.scale.set(1, 1.35, 0.9); g.add(at(cover, x, 0.62, z));
    });
    for (let i = 0; i < 7; i++) {
      const x = -0.06 + (i % 4) * 0.04, z = 0.0 + Math.floor(i / 4) * 0.045;
      shaft(x, z, 0.26);
      g.add(at(rbox(0.05, 0.035, 0.01, 0.004, chrome), x + 0.02, 0.5, z));
    }
    return g;
  }
};

// ---------- More library items ----------
Object.assign(BUILDERS, {
  'Water 10L': () => { const g = BUILDERS['Water 20L'](); g.scale.setScalar(0.8); return g; },
  'Kettle': () => {
    const g = new THREE.Group(), steel = mat(0xd1d5db, 0.25, 0.9);
    const pts = [[0, -0.12], [0.085, -0.12], [0.09, -0.06], [0.08, 0.06], [0.05, 0.1], [0, 0.1]].map(q => new THREE.Vector2(q[0], q[1]));
    g.add(new THREE.Mesh(new THREE.LatheGeometry(pts, 32), steel));
    const handle = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.008, 8, 24, Math.PI), mat(0x111827, 0.6));
    g.add(at(handle, 0, 0.09, 0));
    const spout = cylm(0.012, 0.02, 0.09, steel, 12); spout.rotation.z = -0.9; g.add(at(spout, 0.1, 0.02, 0));
    return g;
  },
  'Pan set': () => {
    const g = new THREE.Group(), dark = mat(0x374151, 0.4, 0.6);
    [[0.14, -0.05], [0.12, 0.0], [0.10, 0.05]].forEach(([r, y]) => {
      g.add(at(cylm(r, r * 0.95, 0.05, dark, 32), 0, y, -0.06));
      g.add(at(rbox(0.03, 0.015, 0.16, 0.005, mat(0x111827, 0.6)), 0, y + 0.01, 0.14));
    });
    return g;
  },
  'Sleeping bag': () => {

function dressMaterial(m) {
  const n = (m.name || '').toLowerCase();
  if ('envMapIntensity' in m) m.envMapIntensity = 1.0;
  if (/ply|pine|slat|cupboard|table top/.test(n)) { m.map = TEX.wood; m.roughness = 0.55; }
  else if (/cushion|mattress|pillow|blanket/.test(n)) { m.map = TEX.fabric; m.roughness = 0.95; }
  else if (/rubber/.test(n)) { m.map = TEX.rubber; m.roughness = 0.9; }
  else if (/headliner|felt/.test(n)) { m.map = TEX.felt; m.roughness = 1; }
  else if (/body|paint|silver/.test(n)) { m.metalness = 0.75; m.roughness = 0.32; m.envMapIntensity = 1.3; }
  else if (/glass/.test(n)) { m.metalness = 0.1; m.roughness = 0.05; m.envMapIntensity = 1.6; }
  else if (/chrome/.test(n)) { m.metalness = 1; m.roughness = 0.12; m.envMapIntensity = 1.5; }

// ---------- Layout loading ----------
function loadLayout(name, done) {
  const def = LAYOUTS[name];
  const apply = (gltf) => {
    if (vanModel) vanRoot.remove(vanModel);

    vanModel.traverse(o => {
      if (o.isMesh) {

    undefined, () => msg('Could not load ' + def.file));
}

// ---------- Surface and placement helpers (van-local coordinates) ----------
function surfaceTop(x, z) {
  let top = 0;
  for (const s of LAYOUTS[currentLayout].surf) {
    if (x >= s.x0 && x <= s.x1 && z >= s.z0 && z <= s.z1 && s.top > top) top = s.top;
  }
  return top;
}
function inCargo(x, z) { return Math.abs(x) <= CARGO.x && z >= CARGO.z0 && z <= CARGO.z1; }
// ---------- Real room surfaces (WebXR plane detection, if the headset reports them) ----------
const realPlanes = new Map();   // XRPlane -> { poly: [Vector3 world], y, mesh, stamp }
let planeCount = 0;
const planeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false });

function updatePlanes(frame) {
  const detected = (frame.worldInformation && frame.worldInformation.detectedPlanes) || frame.detectedPlanes;
  if (!detected) return;
  const refSpace = renderer.xr.getReferenceSpace();
  const seen = new Set();
  detected.forEach(plane => {
    seen.add(plane);
    const prev = realPlanes.get(plane);
    if (prev && prev.stamp === plane.lastChangedTime) return;
    const pose = frame.getPose(plane.planeSpace, refSpace);
    if (!pose) return;
    if (prev) { scene.remove(prev.mesh); prev.mesh.geometry.dispose(); }
    const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
    const poly = plane.polygon.map(p => new THREE.Vector3(p.x, 0, p.z).applyMatrix4(m));
    // Shape uses (x, -z) so that rotateX(-90deg) lands the outline back on (x, 0, z)
    const shape = new THREE.Shape(plane.polygon.map(p => new THREE.Vector2(p.x, -p.z)));
    const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape).rotateX(-Math.PI / 2), planeMat);
    mesh.matrixAutoUpdate = false;
    mesh.matrix.copy(m);
    scene.add(mesh);
    realPlanes.set(plane, { poly, y: m.elements[13], mesh, stamp: plane.lastChangedTime });
  });
  realPlanes.forEach((v, k) => {
    if (!seen.has(k)) { scene.remove(v.mesh); v.mesh.geometry.dispose(); realPlanes.delete(k); }
  });
  planeCount = realPlanes.size;
}

function pointInPoly(x, z, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, zi = poly[i].z, xj = poly[j].x, zj = poly[j].z;
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}
// Highest real surface under (x, z) that is not above the point by more than maxAbove
function realTopAt(x, y, z, maxAbove) {
  let best = null;
  realPlanes.forEach(v => {
    if (v.y > y + maxAbove) return;
    if (best !== null && v.y <= best) return;
    if (pointInPoly(x, z, v.poly)) best = v.y;
  });
  return best;
}

// Put an item on whatever is below it: real furniture or floor, or the van's own surfaces
function seatItem(it) {
  const s = vanRoot.scale.x;
  const wp = vanRoot.localToWorld(it.position.clone());
  let top = realTopAt(wp.x, wp.y, wp.z, 0.15);
  if (top === null) top = world.getWorldPosition(new THREE.Vector3()).y;   // no real surface found: the floor you placed the van on
  const lx = it.position.x, lz = it.position.z;
  if (inCargo(lx, lz)) {
    const vt = vanRoot.localToWorld(new THREE.Vector3(lx, surfaceTop(lx, lz), lz)).y;
    if (vt > top) top = vt;                                // van's own bed, table or stack
  }
  const newY = top + it.userData.h / 2 * s + 0.005 * s;
  it.position.copy(vanRoot.worldToLocal(new THREE.Vector3(wp.x, newY, wp.z)));
}

// Grab: nearest item within reach of the hand, otherwise the item the ray points at (it flies to your hand)
function tryGrab(c) {
  const p = new THREE.Vector3().setFromMatrixPosition(c.matrixWorld);
  let best = null, bestD = 0.25 * Math.max(0.4, scaleValue);
  items.forEach(it => {
    if ([...grabbed.values()].some(g => g.it === it)) return;
    const d = it.getWorldPosition(new THREE.Vector3()).distanceTo(p);
    if (d < bestD) { bestD = d; best = it; }
  });
  let offset = null;
  if (best) offset = best.getWorldPosition(new THREE.Vector3()).sub(p);
  else {
    const hits = rayFromController(c).intersectObjects(items, true).filter(h => h.distance < 8);
    if (hits.length) { best = itemRoot(hits[0].object); offset = new THREE.Vector3(); }
  }
  if (!best) return false;
  grabbed.set(c, { it: best, offset, yawOff: best.rotation.y - (ctrlYaw(c) - vanYaw()),

  pulse(c, 0.5, 30);

}

  pulse(c, 0.25, 20);

    return;
  }

  lastPointer = c;

  const ph = hitPanels(rayFromController(c));
  if (ph) { if (ph.b) { pressButton(ph.P, ph.b); pulse(c, 0.3, 25); } return; }
  if (placing) { confirmPlacing(); pulse(c, 0.5, 40); return; }

  if (tool !== 'none') { toolClick(c); return; }

function updateGrab() {
  grabbed.forEach((g, c) => {
    const p = new THREE.Vector3().setFromMatrixPosition(c.matrixWorld).add(g.offset);
    g.it.position.copy(vanRoot.worldToLocal(p));

    const px = h.uv.x * P.cw, py = (1 - h.uv.y) * P.ch;
    const b = P.buttons.find(b => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) || null;

function updatePanels(now) {
  panelGroup.visible = placed || tourActive;
  if (!panelGroup.visible) { rayLines.forEach(l => { l.visible = false; }); return; }
  updateAnchor();
  const t = (now - panelsShownAt) / 1000;
  panels.forEach(P => {
    const show = !P.hidden && (!P.show || P.show());
    P.mesh.visible = show;
    if (!show) { P.mat.opacity = 0; return; }
    if (P.dynButtons) P.buttons = P.dynButtons();

  const hov = new Map();

  if (renderer.xr.isPresenting) {
    ctrls.forEach((c, i) => {
      if (!c.visible) return;

    const pr = Object.keys(P.pressed).filter(k => P.pressed[k] > now).join(',');

// X-ray: see through the body panels and glass, so you can see the load from outside
let xray = false;
function applyXray() {
  if (!vanModel) return;
  vanModel.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const n = (o.material.name || '').toLowerCase();
    if (!/body|paint|silver|glass|seam|bumper|dark|trim|headliner|felt|led/.test(n)) return;
    if (o.material.userData.baseOpacity === undefined) {
      o.material.userData.baseOpacity = o.material.opacity;
      o.material.userData.baseTransparent = o.material.transparent;
    }
    o.material.transparent = xray || o.material.userData.baseTransparent;
    o.material.opacity = xray ? 0.12 : o.material.userData.baseOpacity;
    o.material.depthWrite = !xray;
    o.material.needsUpdate = true;
  });
}

// Viewpoints: jump to a spot around (or inside) the van, facing it
const VIEWS = {
  rear:   { p: [0, 3.4],    look: [0, 1.2],  eye: 0,    label: 'Rear doors' },
  side:   { p: [-2.3, 0.4], look: [0, 0.4],  eye: 0,    label: 'Side door' },
  inside: { p: [0, 1.75],   look: [0, -0.4], eye: 0.25, label: 'Inside (kneeling)' },
  front:  { p: [0, -4.2],   look: [0, 0],    eye: 0,    label: 'Front' }

function goTo(key) {
  const v = VIEWS[key]; if (!v || !placed) return;
  world.updateMatrixWorld(true);
  const target = world.localToWorld(new THREE.Vector3(v.p[0] * scaleValue, 0, v.p[1] * scaleValue));
  const lookAt = world.localToWorld(new THREE.Vector3(v.look[0] * scaleValue, 0, v.look[1] * scaleValue));
  if (!renderer.xr.isPresenting) {           // desktop preview: move the orbit camera
    if (previewControls) {
      camera.position.set(target.x, 1.6 - v.eye, target.z);
      previewControls.target.set(lookAt.x, 1.0, lookAt.z); previewControls.update();
    }
    msg(v.label); return;
  }
  // Turn so you face the look point from the target spot, then teleport there
  const h = headPos().clone();
  renderer.xr.getCamera().getWorldDirection(_fwd);
  const curYaw = Math.atan2(_fwd.x, _fwd.z), wantYaw = Math.atan2(lookAt.x - target.x, lookAt.z - target.z);
  turnUser(wantYaw - curYaw);
  stage.updateMatrixWorld(true);
  // target moved with the stage turn: recompute it
  const t2 = world.localToWorld(new THREE.Vector3(v.p[0] * scaleValue, 0, v.p[1] * scaleValue));
  moveUser(t2.x - h.x, t2.z - h.z);
  stage.position.y = v.eye;                   // inside: lift the van a little so you are at kneeling height
  msg(v.label);
}

    if (!c) return;

function renderThumb(def) {
  const S = 160, rt = new THREE.WebGLRenderTarget(S, S, { samples: 4 });
  rt.texture.colorSpace = THREE.SRGBColorSpace;
  const sc = new THREE.Scene();
  sc.environment = scene.environment;
  sc.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.2));
  const dl = new THREE.DirectionalLight(0xffffff, 2); dl.position.set(1, 2, 2); sc.add(dl);
  const it = makeItem(def); sc.add(it);
  const box = new THREE.Box3().setFromObject(it), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z) * 0.62;
  const cam = new THREE.PerspectiveCamera(32, 1, 0.01, 20);
  cam.position.copy(c).add(new THREE.Vector3(1.1, 0.75, 1.4).normalize().multiplyScalar(r / Math.tan(16 * Math.PI / 180)));
  cam.lookAt(c);
  const xrWas = renderer.xr.enabled; renderer.xr.enabled = false;
  renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(sc, cam);
  const px = new Uint8Array(S * S * 4); renderer.readRenderTargetPixels(rt, 0, 0, S, S, px);
  renderer.setRenderTarget(null); renderer.xr.enabled = xrWas;
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d'), img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) img.data.set(px.subarray((S - 1 - y) * S * 4, (S - y) * S * 4), y * S * 4);   // flip
  g.putImageData(img, 0, 0);
  rt.dispose();
  return cv;
}

async function checkXR() {
  const ar = navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  const vr = navigator.xr && await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);

  if (!ar && !vr) document.getElementById('noxr').style.display = 'block';
}

// VR walking: left thumbstick moves you where you are looking (the reference space is shifted)
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3();
// ---------- Moving around (VR and AR) ----------
// Left stick: walk where you look. Right stick: snap turn 30 degrees (left/right), smooth up/down is ignored.
// Teleport: point at the ground and pull the trigger (works with hand pinch too).
// All of it moves the stage the opposite way, which is the same as you moving.
const _sunP = new THREE.Vector3(), _head = new THREE.Vector3();
let snapReady = true;
function headPos() { (renderer.xr.isPresenting ? renderer.xr.getCamera() : camera).getWorldPosition(_head); return _head; }
function moveUser(dx, dz) { stage.position.x -= dx; stage.position.z -= dz; }
function turnUser(angle) {          // turn yourself by angle (radians, + = left) around your head
  const h = headPos().clone();
  stage.position.sub(h).applyAxisAngle(new THREE.Vector3(0, 1, 0), -angle).add(h);
  stage.rotation.y -= angle;
}
function vrLocomotion(dt) {
  const session = renderer.xr.getSession();
  if (!session || !placed) return;
  let mx = 0, mz = 0, tx = 0;
  for (const src of session.inputSources) {
    if (!src.gamepad) continue;
    const a = src.gamepad.axes;
    // Quest thumbsticks are axes 2/3; some browsers report them as 0/1
    const sx = a.length >= 4 ? a[2] : (a[0] || 0), sy = a.length >= 4 ? a[3] : (a[1] || 0);
    if (src.handedness === 'left') { mx = sx; mz = sy; }
    if (src.handedness === 'right') { tx = sx; }
  }
  // Right hand holding an item: the right stick spins the item instead of turning you
  const rightHeld = ctrls.find(c => c.userData.src && c.userData.src.handedness === 'right' && grabbed.has(c));
  if (rightHeld) { if (Math.abs(tx) > 0.2) grabbed.get(rightHeld).yawOff -= tx * 2.5 * dt; tx = 0; snapReady = true; }
  if (placing) { if (Math.abs(tx) > 0.2) placing.it.rotation.y -= tx * 2.5 * dt; tx = 0; snapReady = true; }
  if (Math.abs(tx) > 0.7 && snapReady) { turnUser(tx > 0 ? -Math.PI / 6 : Math.PI / 6); snapReady = false; }
  if (Math.abs(tx) < 0.3) snapReady = true;
  if (Math.abs(mx) < 0.15) mx = 0;
  if (Math.abs(mz) < 0.15) mz = 0;
  if (!mx && !mz) return;

  _right.set(-_fwd.z, 0, _fwd.x);
  const speed = 1.6 * dt;
  moveUser((_fwd.x * -mz + _right.x * mx) * speed, (_fwd.z * -mz + _right.z * mx) * speed);
}

// Teleport target: a ring on the ground where the controller points (when not pointing at a panel or item)
const tpMarker = new THREE.Mesh(new THREE.RingGeometry(0.18, 0.24, 40).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x5eead4, transparent: true, opacity: 0.9, depthTest: false }));
tpMarker.renderOrder = 20; tpMarker.visible = false;

const _gp = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), _hit = new THREE.Vector3();
function groundHit(c) {
  const ray = rayFromController(c).ray;
  _gp.constant = -world.getWorldPosition(new THREE.Vector3()).y;      // the floor the van stands on
  if (!ray.intersectPlane(_gp, _hit)) return null;
  if (_hit.distanceTo(ray.origin) > 12) return null;
  return _hit.clone();
}
function updateTeleportMarker() {
  tpMarker.visible = false;
  if (!renderer.xr.isPresenting || !placed) return;
  for (const c of ctrls) {
    if (!c.visible || grabbed.has(c)) continue;
    panelGroup.updateMatrixWorld(true);
    if (hitPanels(rayFromController(c))) continue;
    const g = groundHit(c);
    if (g) { tpMarker.position.copy(g); tpMarker.visible = true; return; }
  }
}
function teleportTo(p) {
  const h = headPos();
  moveUser(p.x - h.x, p.z - h.z);
}

function startPreview() {

  previewControls = new OrbitControls(camera, renderer.domElement);
  camera.position.set(3.5, 2.2, 4.5);

// ---------- Loop ----------
let lastStatusT = -1e9, lastT = 0;
function loop(t, frame) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
  if (renderer.xr.isPresenting) vrLocomotion(dt);
  if (renderer.xr.isPresenting && frame && hitSource && !placed) {
    const hits = frame.getHitTestResults(hitSource);
    if (hits.length) {
      const pose = hits[0].getPose(renderer.xr.getReferenceSpace());
      reticle.matrix.fromArray(pose.transform.matrix);
      reticle.visible = true;
      lastHitValid = true;
    } else { reticle.visible = false; lastHitValid = false; }
  }
  if (renderer.xr.isPresenting && frame) updatePlanes(frame);
  handleButtons();
  updateGrab();
  updateTools();
  updateClipping();
  updatePlacing();
  if (previewControls) previewControls.update();
  if (t - lastStatusT >= 200) { lastStatusT = t; updateStatus(); }   // about 5 times a second
  updatePanels(performance.now());
  // Keep the sun's shadow box centred on the van wherever it was placed
  const wpos = world.getWorldPosition(_sunP);
  sun.target.position.copy(wpos);
  sun.position.set(wpos.x + 3, wpos.y + 6, wpos.z + 4);
  updateTeleportMarker();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(loop);

// Hint text for the desktop preview keyboard shortcut
addEventListener('keydown', e => {
  if (e.key === '1') selectLayout('Bed');

  if (e.key === '3') selectLayout('Packed');
  // Desktop preview cameras: I = inside through the rear doors, O = outside three-quarter view

    camera.position.set(0.15, 1.35, 2.05); previewControls.target.set(0, 0.95, -0.2); previewControls.update();
  }
  // Desktop preview walking: W/A/S/D moves you (camera and its pivot together)

    const f = new THREE.Vector3(); camera.getWorldDirection(f); f.y = 0; f.normalize();

  }
});
